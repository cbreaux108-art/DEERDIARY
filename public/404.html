<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>DeerDiary</title>
    <script>
      // Single-page-app fallback for GitHub Pages: it has no server-side
      // routing, so a direct load of e.g. /DEERDIARY/sightings 404s. This
      // re-encodes the path as a query string and redirects to index.html,
      // which decodes it back (see the inline script in index.html).
      // https://github.com/rafgraph/spa-github-pages
      var segmentCount = 1; // number of path segments before the real route (the "/DEERDIARY" repo name)
      var l = window.location;
      l.replace(
        l.protocol + "//" + l.hostname + (l.port ? ":" + l.port : "") +
          l.pathname.split("/").slice(0, 1 + segmentCount).join("/") + "/?p=/" +
          l.pathname.slice(1).split("/").slice(segmentCount).join("/").replace(/&/g, "~and~") +
          (l.search ? "&q=" + l.search.slice(1).replace(/&/g, "~and~") : "") +
          l.hash,
      );
    </script>
  </head>
  <body></body>
</html>
